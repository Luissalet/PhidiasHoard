[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phidias-hoard"
version = "0.1.0"
description = "Sculpting studio for 3D printing: turns low-poly game scenery into high-resolution models by carving into the mesh the relief its textures and normal maps only draw, closes the ground into a printable block and exports STL, with an MCP bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27", "mcp>=1.10,<2", "pillow>=10", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phidias-hoard = "phidias_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["phidias_hoard*"]

[tool.setuptools.package-data]
phidias_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
